<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.title }} - UG Legon Poultry</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="/" class="text-xs font-bold text-emerald-700 hover:underline">← Back to Main Website</a>
      <span class="text-xs font-bold text-slate-500">UG Legon Poultry Journal</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">
    <article class="bg-white border border-slate-200 rounded-3xl p-8 sm:p-12 shadow-xs space-y-6">
      <div class="space-y-2 border-b border-slate-100 pb-6">
        <span class="text-xs font-bold uppercase tracking-wider text-emerald-700">{{ post.created_at|date:"F d, Y" }}</span>
        <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 leading-tight">{{ post.title }}</h1>
        <p class="text-xs font-medium text-slate-500">Written by {{ post.author }}</p>
      </div>

      {% if post.cover_image_url %}
        <div class="rounded-2xl overflow-hidden aspect-video border border-slate-200">
          <img src="{{ post.cover_image_url }}" alt="{{ post.title }}" class="w-full h-full object-cover">
        </div>
      {% endif %}

      <div class="prose prose-slate text-sm sm:text-base leading-relaxed text-slate-700 space-y-4 whitespace-pre-line">
        {{ post.content }}
      </div>
    </article>
  </main>

</body>
</html>
